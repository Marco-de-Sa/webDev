<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id = "text">text example</p>
    <button onclick="toggleVisibility()">Hide / Show</button>
    <button onclick="changeText()">Change text</button>
    
    <script>
        var ptext = document.getElementById("text");
        function toggleVisibility() {
            if (ptext.style.display == "none"){
                ptext.style.display = "block";
            }else{ 
                ptext.style.display = "none";
            }
        }
        function changeText() {
            if (ptext.innerHTML == "Changed") {
                ptext.innerHTML = "text example";
            } else {
                ptext.innerHTML = "Changed";
            }
        }
    </script>
</body>
</html>
