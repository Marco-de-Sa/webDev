<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id = "clock1"></div>
    <input type="text" id = "clock2">
    <script>
        function clock() {
            
            var d=new Date();
            var t = d.toLocaleTimeString()
            document.getElementById("clock1").innerHTML = t
            document.getElementById("clock2").value=t;
        }
        clock();
        setInterval(clock, 1000);
    </script>
</body>
</html>
